  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- High-Quality Procedural Medical Canvas Generators ---
    // Generates realistic synthetic Chest X-Rays, Retinal Fundus, and Oral Cavity scans with Grad-CAM overlays
    function drawMedicalScan(canvas, domain, withHeatmap, heatmapOpacity, colormap, markerPos) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (domain === 'tb') {
        // --- 1. CHEST X-RAY SYNTHESIS ---
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, w, h);

        // Thoracic outline
        ctx.fillStyle = '#161922';
        ctx.beginPath();
        ctx.ellipse(w / 2, h / 2 + 10, w * 0.42, h * 0.44, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ribs simulation (Curved light streaks)
        ctx.strokeStyle = 'rgba(160, 175, 200, 0.15)';
        ctx.lineWidth = 14;
        for (let i = 0; i < 7; i++) {
          const yOffset = 80 + i * 36;
          // Left ribs
          ctx.beginPath();
          ctx.arc(w / 2 - 20, yOffset, 140 - i * 8, 0.1 * Math.PI, 0.75 * Math.PI);
          ctx.stroke();
          // Right ribs
          ctx.beginPath();
          ctx.arc(w / 2 + 20, yOffset, 140 - i * 8, 0.25 * Math.PI, 0.9 * Math.PI, true);
          ctx.stroke();
        }

        // Lung Fields (Darker air radiolucency)
        const leftLung = ctx.createRadialGradient(w * 0.3, h * 0.45, 10, w * 0.3, h * 0.45, 130);
        leftLung.addColorStop(0, '#020305');
        leftLung.addColorStop(0.8, '#0b0f17');
        leftLung.addColorStop(1, '#1e2430');
        ctx.fillStyle = leftLung;
        ctx.beginPath();
        ctx.ellipse(w * 0.31, h * 0.48, w * 0.16, h * 0.32, -0.05, 0, Math.PI * 2);
        ctx.fill();

        const rightLung = ctx.createRadialGradient(w * 0.69, h * 0.45, 10, w * 0.69, h * 0.45, 130);
        rightLung.addColorStop(0, '#020305');
        rightLung.addColorStop(0.8, '#0b0f17');
        rightLung.addColorStop(1, '#1e2430');
        ctx.fillStyle = rightLung;
        ctx.beginPath();
        ctx.ellipse(w * 0.69, h * 0.48, w * 0.16, h * 0.32, 0.05, 0, Math.PI * 2);
        ctx.fill();

        // Mediastinum & Spine & Cardiac Silhouette
        ctx.fillStyle = 'rgba(210, 220, 235, 0.35)';
        ctx.beginPath();
        // Central spinal column
        ctx.rect(w / 2 - 18, 20, 36, h - 40);
        ctx.fill();

        // Heart shadow (shifting leftwards on patient's left = right of screen)
        ctx.fillStyle = 'rgba(215, 225, 240, 0.45)';
        ctx.beginPath();
        ctx.ellipse(w * 0.45, h * 0.60, w * 0.14, h * 0.18, 0.4, 0, Math.PI * 2);
        ctx.fill();

        // Clavicles
        ctx.strokeStyle = 'rgba(220, 230, 245, 0.45)';
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.moveTo(w * 0.15, 75);
        ctx.quadraticCurveTo(w * 0.35, 95, w * 0.5, 80);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(w * 0.85, 75);
        ctx.quadraticCurveTo(w * 0.65, 95, w * 0.5, 80);
        ctx.stroke();

        // Pathological Infiltrate in Right Upper Lobe (anatomical patient right = screen left)
        ctx.fillStyle = 'rgba(230, 240, 255, 0.38)';
        ctx.beginPath();
        ctx.ellipse(w * 0.30, h * 0.31, 38, 28, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Cavitary ring border
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(w * 0.30, h * 0.31, 20, 0, Math.PI * 2);
        ctx.stroke();

      } else if (domain === 'dr') {
        // --- 2. RETINAL FUNDUS SYNTHESIS ---
        ctx.fillStyle = '#050302';
        ctx.fillRect(0, 0, w, h);

        // Circular Retina Boundary
        const cx = w / 2;
        const cy = h / 2;
        const radius = Math.min(w, h) * 0.45;

        const retinaGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, radius);
        retinaGrad.addColorStop(0, '#9a3412'); // Rich deep fundus orange-red
        retinaGrad.addColorStop(0.7, '#7c2d12');
        retinaGrad.addColorStop(0.96, '#451a03');
        retinaGrad.addColorStop(1, '#000000');

        ctx.fillStyle = retinaGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // Optic Disc (Nasal side)
        const opticX = cx - radius * 0.48;
        const opticY = cy - 8;
        const opticGrad = ctx.createRadialGradient(opticX, opticY, 3, opticX, opticY, 34);
        opticGrad.addColorStop(0, '#fef08a'); // Pale yellowish disc
        opticGrad.addColorStop(0.8, '#fde047');
        opticGrad.addColorStop(1, '#ea580c');
        ctx.fillStyle = opticGrad;
        ctx.beginPath();
        ctx.ellipse(opticX, opticY, 26, 32, 0, 0, Math.PI * 2);
        ctx.fill();

        // Retinal Blood Vessels (Arching arcades)
        ctx.strokeStyle = '#380e07';
        ctx.lineWidth = 4.5;
        // Superior temporal branch
        ctx.beginPath();
        ctx.moveTo(opticX, opticY);
        ctx.bezierCurveTo(cx - 30, cy - radius * 0.65, cx + 50, cy - radius * 0.6, cx + radius * 0.6, cy - radius * 0.3);
        ctx.stroke();

        // Inferior temporal branch
        ctx.beginPath();
        ctx.moveTo(opticX, opticY);
        ctx.bezierCurveTo(cx - 30, cy + radius * 0.65, cx + 50, cy + radius * 0.6, cx + radius * 0.6, cy + radius * 0.3);
        ctx.stroke();

        // Macula & Fovea Centralis (Darker avascular zone)
        const maculaX = cx + radius * 0.22;
        const maculaY = cy;
        ctx.fillStyle = 'rgba(67, 20, 7, 0.7)';
        ctx.beginPath();
        ctx.arc(maculaX, maculaY, 35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#220803';
        ctx.beginPath();
        ctx.arc(maculaX, maculaY, 7, 0, Math.PI * 2);
        ctx.fill();

        // Diabetic Retinopathy Lesions: Microaneurysms & Blot Hemorrhages
        ctx.fillStyle = '#450a0a';
        const lesions = [
          [maculaX - 30, maculaY - 25, 4],
          [maculaX - 15, maculaY + 30, 5],
          [maculaX + 25, maculaY - 35, 6],
          [maculaX + 45, maculaY + 15, 3.5],
          [cx + 10, cy - 40, 5]
        ];
        lesions.forEach(([lx, ly, lr]) => {
          ctx.beginPath();
          ctx.arc(lx, ly, lr, 0, Math.PI * 2);
          ctx.fill();
        });

        // Hard Exudates (bright yellowish flecks)
        ctx.fillStyle = '#fef9c3';
        const exudates = [
          [maculaX + 15, maculaY - 18],
          [maculaX + 20, maculaY - 12],
          [maculaX + 25, maculaY - 22],
          [maculaX + 32, maculaY - 15]
        ];
        exudates.forEach(([ex, ey]) => {
          ctx.beginPath();
          ctx.ellipse(ex, ey, 3.5, 2, 0.3, 0, Math.PI * 2);
          ctx.fill();
        });

      } else if (domain === 'oral') {
        // --- 3. ORAL CANCER & PRE-MALIGNANT LESION SYNTHESIS ---
        ctx.fillStyle = '#1c080a';
        ctx.fillRect(0, 0, w, h);

        // Oral Mucosa Background (pinkish-red flesh)
        const mucosaGrad = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * 0.5);
        mucosaGrad.addColorStop(0, '#9f1239'); // deep buccal red
        mucosaGrad.addColorStop(0.6, '#881337');
        mucosaGrad.addColorStop(1, '#4c0519');
        ctx.fillStyle = mucosaGrad;
        ctx.fillRect(0, 0, w, h);

        // Tongue Lateral Surface
        ctx.fillStyle = '#be123c';
        ctx.beginPath();
        ctx.ellipse(w * 0.45, h * 0.55, w * 0.35, h * 0.4, -0.3, 0, Math.PI * 2);
        ctx.fill();

        // Lingual papillae texture
        ctx.fillStyle = 'rgba(255, 200, 210, 0.2)';
        for (let i = 0; i < 40; i++) {
          const px = w * 0.25 + (i % 8) * 22 + (Math.random() * 6);
          const py = h * 0.35 + Math.floor(i / 8) * 26 + (Math.random() * 6);
          ctx.beginPath();
          ctx.arc(px, py, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Dental arch outline on the side
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        for (let t = 0; t < 4; t++) {
          ctx.beginPath();
          ctx.roundRect(w * 0.82, h * 0.25 + t * 45, 45, 34, [8, 4, 4, 8]);
          ctx.fill();
          ctx.stroke();
        }

        // Suspicious Squamous Cell Carcinoma / Leukoplakia Patch with Indurated Border
        const lesionX = w * 0.42;
        const lesionY = h * 0.48;

        // Erythroplakia red base
        ctx.fillStyle = '#450a0a';
        ctx.beginPath();
        ctx.ellipse(lesionX, lesionY, 52, 40, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Keratotic Leukoplakia white rough plaques
        ctx.fillStyle = 'rgba(254, 242, 242, 0.88)';
        ctx.beginPath();
        ctx.ellipse(lesionX - 10, lesionY - 5, 34, 22, 0.4, 0, Math.PI * 2);
        ctx.fill();

        // Irregular ulcerated central crater
        ctx.fillStyle = '#1e0508';
        ctx.beginPath();
        ctx.ellipse(lesionX + 4, lesionY + 3, 16, 12, -0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- GRAD-CAM HEATMAP OVERLAY ---
      if (withHeatmap) {
        ctx.save();
        ctx.globalAlpha = heatmapOpacity;

        // Define activation center & radius per domain
        let hx = w * 0.30, hy = h * 0.31, r = 85;
        if (domain === 'dr') {
          hx = w / 2 + (Math.min(w, h) * 0.45) * 0.22;
          hy = h / 2 - 12;
          r = 75;
        } else if (domain === 'oral') {
          hx = w * 0.42;
          hy = h * 0.48;
          r = 95;
        }

        const heatGrad = ctx.createRadialGradient(hx, hy, 5, hx, hy, r);

        if (colormap === 'jet' || colormap === 'turbo') {
          heatGrad.addColorStop(0.0, 'rgba(255, 0, 0, 0.95)');       // Peak activation (Red)
          heatGrad.addColorStop(0.25, 'rgba(255, 140, 0, 0.85)');    // Orange
          heatGrad.addColorStop(0.5, 'rgba(255, 235, 0, 0.7)');      // Yellow
          heatGrad.addColorStop(0.75, 'rgba(0, 220, 100, 0.45)');    // Green
          heatGrad.addColorStop(0.92, 'rgba(0, 100, 255, 0.2)');     // Cyan/Blue
          heatGrad.addColorStop(1.0, 'rgba(0, 0, 255, 0)');          // Transparent
        } else if (colormap === 'inferno') {
          heatGrad.addColorStop(0.0, 'rgba(252, 255, 164, 0.95)');
          heatGrad.addColorStop(0.3, 'rgba(249, 142, 9, 0.85)');
          heatGrad.addColorStop(0.6, 'rgba(187, 55, 84, 0.7)');
          heatGrad.addColorStop(0.85, 'rgba(87, 16, 110, 0.4)');
          heatGrad.addColorStop(1.0, 'rgba(0, 0, 4, 0)');
        }

        ctx.fillStyle = heatGrad;
        ctx.beginPath();
        ctx.arc(hx, hy, r, 0, Math.PI * 2);
        ctx.fill();

        // Secondary satellite activations for realism
        const sat1 = ctx.createRadialGradient(hx + 30, hy + 25, 2, hx + 30, hy + 25, r * 0.5);
        sat1.addColorStop(0, 'rgba(255, 120, 0, 0.7)');
        sat1.addColorStop(1, 'rgba(0, 0, 255, 0)');
        ctx.fillStyle = sat1;
        ctx.beginPath();
        ctx.arc(hx + 30, hy + 25, r * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Draw Bounding Box / Contour Guide
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(hx - r * 0.75, hy - r * 0.75, r * 1.5, r * 1.5);
        ctx.setLineDash([]);

        // Contour Label
        ctx.fillStyle = 'rgba(239, 68, 68, 0.9)';
        ctx.fillRect(hx - r * 0.75, hy - r * 0.75 - 18, 110, 18);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px monospace';
        ctx.fillText('ROI: GRAD-CAM α=0.98', hx - r * 0.75 + 4, hy - r * 0.75 - 5);

        ctx.restore();
      }

      // Draw Cursor Reticle on Hover
      if (markerPos) {
        ctx.strokeStyle = '#14b8a6';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(markerPos.x - 10, markerPos.y);
        ctx.lineTo(markerPos.x + 10, markerPos.y);
        ctx.moveTo(markerPos.x, markerPos.y - 10);
        ctx.lineTo(markerPos.x, markerPos.y + 10);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(20, 184, 166, 0.4)';
        ctx.beginPath();
        ctx.arc(markerPos.x, markerPos.y, 16, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function MainApp() {
      // --- APP STATE ---
      const [domain, setDomain] = useState('tb'); // 'tb' | 'dr' | 'oral' | 'dm'
      const [selectedPresetKey, setSelectedPresetKey] = useState('tb_severe');
      const [patient, setPatient] = useState(CLINICAL_PRESETS.tb_severe.patient);

                        {findings.severity}
                      </span>
                    </div>
                    <h3 className="text-base font-black text-slate-950">
                      {findings.primary}
                    </h3>
                    <div className="flex items-center space-x-4 text-xs font-mono text-slate-600 pt-1">
                      <span>Confidence: <strong>{findings.confidence}%</strong></span>
                      <span>Uncertainty: <strong>±{findings.uncertainty}%</strong></span>
                      <span>Classification: <strong>{findings.icd10}</strong></span>
                    </div>
                  </div>

                  {/* Clinical Action Protocol */}
                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                      Stat Emergency Referral & Treatment Protocol:
                    </h4>
                    <ol className="list-decimal list-inside space-y-1 text-xs text-slate-700">
                      {findings.actionProtocol.map((act, i) => (
                        <li key={i} className="pl-1">{act}</li>
                      ))}
                    </ol>
                  </div>

                  {/* Sign-off area */}
                  <div className="pt-6 border-t border-slate-300 flex justify-between items-end text-xs">
                    <div>
                      <p className="text-[11px] text-slate-500">
                        * Automated AI co-pilot preliminary assessment. Verified with INT8 Edge model.
                      </p>
                      <p className="text-[11px] text-slate-500">
                        Compliant with WHO Class IIa AI Medical Device guidelines.
                      </p>
                    </div>
                    <div className="text-center">
                      <div className="w-44 border-b border-slate-800 pb-1 font-signature text-sm font-semibold">
                        Dr. A. Sengupta, MD
                      </div>
                      <span className="text-[10px] text-slate-500 uppercase tracking-wider">
                        Attending Medical Officer Signature
                      </span>
                    </div>
                  </div>

                </div>

                {/* Print Action Buttons */}
                <div className="no-print mt-6 flex items-center justify-end space-x-3 pt-3 border-t border-slate-200">
                  <button
                    onClick={() => setShowReportModal(false)}
                    className="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold transition"
                  >
                    Close
                  </button>
                  <button
                    onClick={() => window.print()}
                    className="px-5 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold flex items-center space-x-2 shadow-lg transition"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    <span>Print / Save PDF</span>
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* 4. FOOTER & COMPLIANCE BAR                               */}
          {/* ======================================================== */}
          <footer className="glass-panel border-t border-slate-800/90 py-3 px-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <span className="font-mono text-[11px]">
                AURA-MED AI Engine • Built for Low-Resource Healthcare & Under-Resourced Clinics
              </span>
              <div className="flex items-center space-x-3 text-[11px]">
                <span className="text-teal-400 font-mono">ONNX Runtime Web INT8</span>
                <span>•</span>
                <span className="text-slate-400">HIPAA & GDPR Compliant</span>
                <span>•</span>
                <span className="text-cyan-400 font-mono">WHO-ICDR Triage Protocol</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render the React App into the DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
